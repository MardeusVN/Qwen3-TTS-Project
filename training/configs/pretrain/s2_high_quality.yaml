# ============================================================================
# Qwen3-TTS-12Hz Pre-training Stage 2: High-Quality Stage (S2)
# Paper §3.2 (2): "stratify data quality with a dedicated pipeline and perform 
# continual pre-training (CPT) with high-quality data. This stage alleviates 
# hallucinations caused by noisy data in the initial stage."
# ============================================================================

stage: s2_high_quality
description: "Continual pre-training on high-quality filtered data to reduce hallucinations"
resume_from: outputs/checkpoints/s1_general/checkpoint-final  # Từ S1

# ---------------------------------------------------------------------------
# MODEL CONFIGURATION (giống S1)
# ---------------------------------------------------------------------------
model:
  model_type: qwen3_tts
  tokenizer_type: qwen3_tts_tokenizer_12hz
  tts_model_size: "1.7b"
  tts_model_type: base
  
  im_start_token_id: 151644
  im_end_token_id: 151645
  tts_pad_token_id: 151671
  tts_bos_token_id: 151672
  tts_eos_token_id: 151673
  
  talker_config:
    model_type: qwen3_tts_talker
    vocab_size: 4206
    text_vocab_size: 3072
    hidden_size: 2048
    intermediate_size: 6144
    num_hidden_layers: 24
    num_attention_heads: 16
    num_key_value_heads: 2
    hidden_act: silu
    max_position_embeddings: 8192     # Vẫn 8K ở S2
    initializer_range: 0.02
    rms_norm_eps: 0.000001
    use_cache: true
    tie_word_embeddings: false
    rope_theta: 10000.0
    rope_scaling: null
    attention_bias: false
    use_sliding_window: false
    sliding_window: 4096
    attention_dropout: 0.0
    num_code_groups: 16
    
    codec_eos_token_id: 4198
    codec_think_id: 4202
    codec_nothink_id: 4203
    codec_think_bos_id: 4204
    codec_think_eos_id: 4205
    codec_pad_id: 4196
    codec_bos_id: 4197
    
    codec_language_id:
      chinese: 4199
      english: 4200
      japanese: 4201
      korean: 4206
      german: 4208
      italian: 4209
      portuguese: 4210
      spanish: 4211
      french: 4212
      russian: 4213
    
    spk_id: {}
    spk_is_dialect: {}
    
    code_predictor_config:
      model_type: qwen3_tts_talker_code_predictor
      vocab_size: 2048
      hidden_size: 1024
      intermediate_size: 3072
      num_hidden_layers: 5
      num_attention_heads: 16
      num_key_value_heads: 8
      head_dim: 128
      hidden_act: silu
      max_position_embeddings: 32768
      initializer_range: 0.02
      rms_norm_eps: 0.000001
      use_cache: true
      tie_word_embeddings: false
      rope_theta: 10000.0
      attention_bias: false
      use_sliding_window: false
      sliding_window: 4096
      max_window_layers: 28
      attention_dropout: 0.0
      num_code_groups: 16
  
  speaker_encoder_config:
    mel_dim: 128
    enc_dim: 1024
    enc_channels: [512, 512, 512, 512, 1536]
    enc_kernel_sizes: [5, 3, 3, 3, 1]
    enc_dilations: [1, 2, 3, 4, 1]
    enc_attention_channels: 128
    enc_res2net_scale: 8
    enc_se_channels: 128
    sample_rate: 24000

# ---------------------------------------------------------------------------
# DATA CONFIGURATION
# ---------------------------------------------------------------------------
data:
  train_dir: data/pretrain/s2/train
  val_dir: data/pretrain/s2/val
  max_codec_len: 2048
  min_duration: 0.5
  max_duration: 30.0
  languages:
    - chinese
    - english
    - german
    - italian
    - portuguese
    - spanish
    - japanese
    - korean
    - french
    - russian
  
  # Quality filtering thresholds (Paper §3.2: "stratify data quality")
  quality_filter:
    min_utmos: 3.5            # UTMOS >= 3.5
    min_speaker_sim: 0.75     # Speaker similarity >= 0.75
    max_wer: 0.05             # WER <= 5%
  
  language_weights:
    chinese: 0.35
    english: 0.30
    german: 0.05
    italian: 0.05
    portuguese: 0.05
    spanish: 0.05
    japanese: 0.05
    korean: 0.05
    french: 0.05
    russian: 0.05
  long_speech_upsample_ratio: 1.0

# ---------------------------------------------------------------------------
# TRAINING HYPERPARAMETERS
# Paper §3.2: "continual pre-training" với LR thấp hơn S1
# ---------------------------------------------------------------------------
training:
  optimizer: adamw
  learning_rate: 3.0e-5       # Thấp hơn S1 (1e-4) → CPT
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  
  lr_scheduler: cosine
  warmup_ratio: 0.005         # Warmup ngắn hơn S1
  max_grad_norm: 1.0
  
  num_train_epochs: 2          # 2 epochs cho CPT
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 64     # Global batch ~256
  
  bf16: true
  tf32: true
  
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  prefetch_factor: 2
  
  output_dir: outputs/checkpoints/s2_high_quality
  save_strategy: steps
  save_steps: 2000
  save_total_limit: 3
  logging_steps: 10
  
  gradient_checkpointing: true
  
  fsdp: full_shard auto_wrap
  fsdp_config:
    min_num_params: 10000000
    transformer_layer_cls_to_wrap: Qwen3TTSTalkerDecoderLayer
    backward_prefetch: backward_pre
    forward_prefetch: true
  
  report_to: wandb
  run_name: qwen3_tts_12hz_s2_high_quality
  
  remove_unused_columns: false
  seed: 42

loss:
  talker_weight: 1.0
  mtp_weight: 1.0
  ignore_index: -100

tokenizer:
  path: Qwen/Qwen3-TTS-Tokenizer-12Hz
  freeze: true